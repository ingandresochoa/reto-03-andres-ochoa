name: Deploy front a GitHub Pages

# Publica el front compilado en GitHub Pages en cada push a main que toque
# web/ o este workflow. La URL de la API (backend en Render) se inyecta como
# VITE_API_URL desde la variable de repositorio BACKEND_URL.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el front (base = subruta de Pages)
        run: npm run build -- --base=/reto-03-andres-ochoa/
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
